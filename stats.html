<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Win/Loss Stats — Marvel Legendary Randomizer</title>
  <meta name="description" content="Per-card win/loss stats logged from your Marvel Legendary Randomizer games." />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23ed1d24'/%3E%3Ctext x='50' y='68' font-family='Arial' font-weight='bold' font-size='56' fill='white' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css?v=163" />
</head>
<body>
  <div class="navbar" id="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-badge" style="text-decoration: none;">L</a>
      <span class="navbar-title">Win/Loss Stats</span>
    </div>
  </div>

  <main class="screen" id="screen">
    <div class="large-title-block">
      <h1 class="large-title">Win/Loss<br />Stats</h1>
      <p class="large-subtitle">Per-card results from your logged games</p>
    </div>

    <section class="ios-group">
      <div class="group-header"><span>Overview</span></div>
      <ul class="ios-list">
        <li class="ios-row">
          <span class="row-text">Games Logged</span>
          <span class="row-trailing" id="games-logged">0</span>
        </li>
        <li class="ios-row">
          <span class="row-text">Heroes Win Rate</span>
          <span class="row-trailing" id="hero-win-rate">—</span>
        </li>
      </ul>
    </section>

    <div id="stats-sections"></div>

    <section class="ios-group action-group hidden" id="clear-stats-group">
      <ul class="ios-list">
        <li class="ios-row-button">
          <button type="button" id="clear-stats" class="ios-list-button destructive">Clear All Stats</button>
        </li>
      </ul>
      <p class="group-footer">Resets every card's win/loss record and the lifetime game count. This can't be undone.</p>
    </section>

    <p class="page-footer">
      <a href="index.html" class="footer-button">‹ Back to Randomizer</a>
    </p>
  </main>

  <!-- Keep this ?v= in step with index.html's — see the note there. -->
  <script src="js/data.js?v=163"></script>
  <script src="js/stats.js?v=163"></script>
</body>
</html>
