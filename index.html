<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Marvel Legendary Randomizer</title>
  <meta name="description" content="Randomize a full Marvel Legendary deck-building game setup: Mastermind, Scheme, Villain Groups, Henchmen, and Heroes." />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23ed1d24'/%3E%3Ctext x='50' y='68' font-family='Arial' font-weight='bold' font-size='56' fill='white' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css?v=133" />
</head>
<body>
  <div class="navbar" id="navbar">
    <div class="navbar-inner">
      <span class="navbar-badge">L</span>
      <span class="navbar-title">Legendary Randomizer</span>
    </div>
  </div>

  <main class="screen" id="screen">
    <section class="ios-group">
      <div class="group-header"><span>History</span></div>
      <ul class="ios-list">
        <li>
          <button type="button" class="ios-row nav-row" id="open-history">
            <span class="row-text">Past Setups</span>
            <span class="row-trailing" id="history-count">0 saved</span>
            <span class="chevron">›</span>
          </button>
        </li>
        <li>
          <a class="ios-row nav-row" href="stats.html">
            <span class="row-text">Win/Loss Stats</span>
            <span class="chevron">›</span>
          </a>
        </li>
      </ul>
    </section>

    <section class="ios-group">
      <div class="group-header"><span>Expansions</span></div>
      <ul class="ios-list">
        <li>
          <button type="button" class="ios-row nav-row" id="open-expansions">
            <span class="row-text">Manage Expansions</span>
            <span class="row-trailing" id="expansions-count">0 of 0</span>
            <span class="chevron">›</span>
          </button>
        </li>
      </ul>
    </section>

    <section class="ios-group">
      <div class="group-header"><span>Custom Content</span></div>
      <ul class="ios-list">
        <li>
          <button type="button" class="ios-row nav-row" id="open-custom-cards">
            <span class="row-text">Custom Cards</span>
            <span class="row-trailing" id="custom-cards-count">0 saved</span>
            <span class="chevron">›</span>
          </button>
        </li>
        <li>
          <button type="button" class="ios-row nav-row" id="open-glossary">
            <span class="row-text">Keyword Glossary</span>
            <span class="chevron">›</span>
          </button>
        </li>
      </ul>
    </section>

    <section class="ios-group hidden" id="team-theme-section">
      <div class="group-header"><span>Hero Team Theme</span></div>
      <ul class="ios-list">
        <li>
          <button type="button" class="ios-row nav-row" id="open-team-theme">
            <span class="row-text">Team Filter</span>
            <span class="row-trailing" id="team-theme-count">0 of 0</span>
            <span class="chevron">›</span>
          </button>
        </li>
      </ul>
    </section>

    <section class="ios-group">
      <div class="group-header">
        <span>Card Pool</span>
      </div>
      <ul class="ios-list" id="card-pool-list"></ul>
    </section>

    <section class="ios-group">
      <div class="group-header"><span>Setup Size</span></div>
      <ul class="ios-list">
        <li class="ios-row">
          <span class="row-text">Players</span>
          <span class="segmented" id="players-segmented">
            <button type="button" data-value="1">1</button>
            <button type="button" data-value="2">2</button>
            <button type="button" data-value="3">3</button>
            <button type="button" data-value="4">4</button>
            <button type="button" data-value="5">5</button>
          </span>
        </li>
      </ul>
    </section>

    <div id="warnings" class="ios-banner hidden"></div>

    <section class="ios-group action-group">
      <ul class="ios-list">
        <li class="ios-row-button">
          <button type="button" id="randomize-all" class="ios-list-button primary">Randomize Setup</button>
        </li>
      </ul>
    </section>

    <section class="ios-group action-group hidden" id="reroll-group">
      <ul class="ios-list">
        <li class="ios-row-button">
          <button type="button" id="reroll-all" class="ios-list-button">Reroll All</button>
        </li>
      </ul>
    </section>

    <div id="results"></div>

    <section class="ios-group action-group hidden" id="copy-group">
      <ul class="ios-list">
        <li class="ios-row-button">
          <button type="button" id="copy-setup" class="ios-list-button">Copy Setup</button>
        </li>
      </ul>
    </section>

    <section class="ios-group action-group hidden" id="outcome-group">
      <div class="group-header"><span>Log Result</span></div>
      <ul class="ios-list">
        <li class="ios-row-button">
          <button type="button" id="log-win" class="ios-list-button outcome-btn outcome-win">Heroes Won</button>
        </li>
        <li class="ios-row-button">
          <button type="button" id="log-loss" class="ios-list-button outcome-btn outcome-loss">Evil Won</button>
        </li>
      </ul>
    </section>

    <section class="ios-group action-group hidden" id="exclude-group">
      <ul class="ios-list">
        <li class="ios-row-button">
          <button type="button" id="exclude-setup" class="ios-list-button">Exclude This Setup's Cards</button>
        </li>
      </ul>
    </section>

    <p class="page-footer">Fan-made, unofficial companion tool. Not affiliated with Upper Deck Entertainment or Marvel.</p>
  </main>

  <div class="sheet-overlay hidden" id="sheet-overlay">
    <button type="button" class="sheet-backdrop" id="sheet-backdrop" aria-label="Close"></button>
    <div class="sheet" id="sheet">
      <div class="sheet-grabber"></div>
      <div class="sheet-header">
        <button type="button" class="sheet-header-btn" id="sheet-cancel">Back</button>
        <span class="sheet-title" id="sheet-title">Manage</span>
        <button type="button" class="sheet-header-btn sheet-header-btn-accent hidden" id="sheet-action">Clear</button>
      </div>
      <div class="sheet-search-wrap hidden" id="sheet-search-wrap">
        <input type="search" id="sheet-search" class="sheet-search" placeholder="Search" autocomplete="off" />
      </div>
      <div class="sheet-bulk-actions hidden" id="sheet-bulk-actions">
        <button type="button" class="sheet-bulk-btn" id="sheet-select-all">Select All</button>
        <button type="button" class="sheet-bulk-btn" id="sheet-deselect-all">Deselect All</button>
      </div>
      <div class="sheet-list" id="sheet-list"></div>
    </div>
  </div>

  <!-- Bump every ?v= below (including the stylesheet in <head>) on any
       deploy that touches css/js — GitHub Pages / mobile browsers can
       otherwise keep serving a stale cached copy after a redeploy. -->
  <script src="js/data.js?v=133"></script>
  <script src="js/app.js?v=133"></script>
</body>
</html>
