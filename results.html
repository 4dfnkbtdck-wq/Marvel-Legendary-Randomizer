<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Results — Marvel Legendary Randomizer</title>
  <meta name="description" content="Your randomized Marvel Legendary setup: reroll, review, copy, and log the result." />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23ed1d24'/%3E%3Ctext x='50' y='68' font-family='Arial' font-weight='bold' font-size='56' fill='white' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="img/icons/icon-180.png?v=167" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Legendary" />
  <link rel="stylesheet" href="css/styles.css?v=167" />
</head>
<body>
  <div class="navbar" id="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-badge" style="text-decoration: none;">L</a>
      <span class="navbar-title">Results</span>
    </div>
  </div>

  <main class="screen" id="screen">
    <p class="page-footer page-footer-top">
      <a href="index.html" class="footer-button">‹ Back to Randomizer</a>
    </p>

    <section class="ios-group action-group hidden" id="reroll-group">
      <ul class="ios-list">
        <li class="ios-row-button">
          <button type="button" id="reroll-all" class="ios-list-button">Reroll All</button>
        </li>
      </ul>
    </section>

    <div id="results"></div>

    <section class="ios-group action-group hidden" id="copy-group">
      <ul class="ios-list">
        <li class="ios-row-button">
          <button type="button" id="copy-setup" class="ios-list-button">Copy Setup</button>
        </li>
      </ul>
    </section>

    <section class="ios-group action-group hidden" id="setup-keywords-group">
      <ul class="ios-list">
        <li class="ios-row-button">
          <button type="button" id="setup-keywords" class="ios-list-button">Setup Keywords</button>
        </li>
      </ul>
    </section>

    <section class="ios-group action-group hidden" id="outcome-group">
      <div class="group-header"><span>Log Result</span></div>
      <ul class="ios-list">
        <li class="ios-row-button">
          <button type="button" id="log-win" class="ios-list-button outcome-btn outcome-win">Heroes Won</button>
        </li>
        <li class="ios-row-button">
          <button type="button" id="log-loss" class="ios-list-button outcome-btn outcome-loss">Evil Won</button>
        </li>
      </ul>
    </section>

    <section class="ios-group action-group hidden" id="exclude-group">
      <ul class="ios-list">
        <li class="ios-row-button">
          <button type="button" id="exclude-setup" class="ios-list-button">Exclude This Setup's Cards</button>
        </li>
      </ul>
    </section>

    <p class="page-footer">
      <a href="index.html" class="footer-button">‹ Back to Randomizer</a>
    </p>
  </main>

  <div class="sheet-overlay hidden" id="sheet-overlay">
    <button type="button" class="sheet-backdrop" id="sheet-backdrop" aria-label="Close"></button>
    <div class="sheet" id="sheet">
      <div class="sheet-grabber"></div>
      <div class="sheet-header">
        <button type="button" class="sheet-header-btn" id="sheet-cancel">Back</button>
        <span class="sheet-title" id="sheet-title">Manage</span>
        <button type="button" class="sheet-header-btn sheet-header-btn-accent hidden" id="sheet-action">Clear</button>
      </div>
      <div class="sheet-search-wrap hidden" id="sheet-search-wrap">
        <input type="search" id="sheet-search" class="sheet-search" placeholder="Search" autocomplete="off" />
      </div>
      <div class="sheet-bulk-actions hidden" id="sheet-bulk-actions">
        <button type="button" class="sheet-bulk-btn" id="sheet-select-all">Select All</button>
        <button type="button" class="sheet-bulk-btn" id="sheet-deselect-all">Deselect All</button>
      </div>
      <div class="sheet-list" id="sheet-list"></div>
    </div>
  </div>

  <!-- Keep this ?v= in step with index.html's — see the note there. -->
  <script src="js/data.js?v=167"></script>
  <script src="js/app.js?v=167"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
    }
  </script>
</body>
</html>
